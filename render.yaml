services:
  - type: web
    name: arya-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: GOOGLE_TOKEN_B64
        sync: false
      - key: GOOGLE_CREDENTIALS_B64
        sync: false
